<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Quản Lý Phụ Tùng Ô Tô</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .banner-img { height: 320px; object-fit: cover; width: 100%; border-radius: 10px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" id="brand-name">Phụ Tùng Ô Tô Việt</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3 small d-none d-md-inline">📍 <strong id="nav-address">---</strong> | 📞 <strong id="nav-phone">---</strong></span>
                <a href="admin.html" class="btn btn-outline-light btn-sm me-2" id="admin-nav" style="display:none;">Quản Trị</a>
                <button class="btn btn-outline-warning btn-sm" id="login-btn" onclick="openLoginModal()">Đăng Nhập</button>
                <button class="btn btn-outline-danger btn-sm" id="logout-btn" style="display:none;" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <!-- Banner di chuyển mỗi 5 giây -->
    <div class="container my-3" id="banner-section">
        <div id="carouselBanners" class="carousel slide shadow-sm" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner" id="carousel-inner"></div>
        </div>
    </div>

    <!-- Tìm kiếm hàng hóa & giá bán -->
    <div class="container my-4">
        <div class="card p-4 shadow-sm mb-4">
            <h4 class="mb-3 fw-bold text-primary">🔍 Tra Cứu Phụ Tùng & Giá Bán Nhanh</h4>
            <div class="input-group mb-3">
                <input type="text" id="search-input" class="form-control" placeholder="Nhập tên, mã số, thương hiệu hoặc nhà cung cấp...">
                <button class="btn btn-primary" onclick="searchParts()">Tìm Kiếm</button>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped bg-white align-middle">
                    <thead class="table-dark">
                        <tr><th>Thương hiệu</th><th>Chủng loại</th><th>Mã số</th><th>Nhà cung cấp</th><th>Tồn kho</th><th>Giá Bán</th></tr>
                    </thead>
                    <tbody id="public-search-results">
                        <tr><td colspan="6" class="text-center text-muted">Nhập thông tin để tìm kiếm phụ tùng...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Đăng Nhập Quản Lý</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>Tài khoản:</label><input type="text" id="log-user" class="form-control" value="admin"></div>
                    <div class="mb-3"><label>Mật khẩu:</label><input type="password" id="log-pass" class="form-control" value="123456"></div>
                </div>
                <div class="modal-footer"><button class="btn btn-primary w-100" onclick="login()">Đăng Nhập</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function init() {
            const resSet = await fetch('/api/settings');
            const settings = await resSet.json();
            if(settings.name) {
                document.getElementById('brand-name').innerText = settings.name;
                document.getElementById('page-title').innerText = settings.name;
            }
            if(settings.address) document.getElementById('nav-address').innerText = settings.address;
            if(settings.phone) document.getElementById('nav-phone').innerText = settings.phone;
            
            try {
                const banners = JSON.parse(settings.banners || '[]');
                if(banners.length > 0) {
                    document.getElementById('carousel-inner').innerHTML = banners.map((url, idx) => `
                        <div class="carousel-item ${idx === 0 ? 'active' : ''}">
                            <img src="${url}" class="banner-img shadow-sm" alt="Banner">
                        </div>
                    `).join('');
                }
            } catch(e) {}
            checkUserRole();
            searchParts();
        }

        async function searchParts() {
            const keyword = document.getElementById('search-input').value;
            const res = await fetch(`/api/inventory?search=${encodeURIComponent(keyword)}`);
            const data = await res.json();
            document.getElementById('public-search-results').innerHTML = data.length === 0 ? 
                `<tr><td colspan="6" class="text-center text-muted">Không tìm thấy phụ tùng phù hợp</td></tr>` :
                data.map(i => `
                    <tr>
                        <td><b>${i.brand}</b></td>
                        <td>${i.category}</td>
                        <td><code>${i.part_code}</code></td>
                        <td>${i.supplier}</td>
                        <td><span class="badge ${i.quantity > 1 ? 'bg-success' : i.quantity === 1 ? 'bg-warning text-dark' : 'bg-danger'}">${i.quantity}</span></td>
                        <td class="fw-bold text-danger">${Number(i.sell_price).toLocaleString()}đ</td>
                    </tr>
                `).join('');
        }

        function openLoginModal() { new bootstrap.Modal(document.getElementById('loginModal')).show(); }

        async function login() {
            const username = document.getElementById('log-user').value;
            const password = document.getElementById('log-pass').value;
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
            const data = await res.json();
            if(data.success) { localStorage.setItem('user', JSON.stringify(data.user)); window.location.href = 'admin.html'; } else { alert(data.error); }
        }

        function logout() { localStorage.removeItem('user'); location.reload(); }

        function checkUserRole() {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user) {
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
                document.getElementById('admin-nav').style.display = 'inline-block';
            }
        }
        init();
    </script>
</body>
</html>
