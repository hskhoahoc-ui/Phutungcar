<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Quản Lý Phụ Tùng Ô Tô</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .banner-img { height: 320px; object-fit: cover; width: 100%; border-radius: 10px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" id="brand-name">Phụ Tùng Ô Tô Việt</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3 small d-none d-md-inline">📍 <strong id="nav-address">---</strong> | 📞 <strong id="nav-phone">---</strong></span>
                <a href="admin.html" class="btn btn-outline-light btn-sm me-2" id="admin-nav" style="display:none;">Quản Trị</a>
                <button class="btn btn-outline-warning btn-sm" id="login-btn" onclick="openLoginModal()">Đăng Nhập</button>
                <button class="btn btn-outline-danger btn-sm" id="logout-btn" style="display:none;" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <!-- Banner -->
    <div class="container my-3" id="banner-section">
        <div id="carouselBanners" class="carousel slide shadow-sm" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner" id="carousel-inner"></div>
        </div>
    </div>

    <!-- Tra cứu phụ tùng & chọn lọc -->
    <div class="container my-4">
        <div class="card p-4 shadow-sm mb-4">
            <h4 class="mb-3 fw-bold text-primary">🔍 Tra Cứu Phụ Tùng & Phụ Kiện Ô Tô</h4>
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <input type="text" id="search-input" class="form-control" placeholder="Nhập tên, mã số..." oninput="searchParts()">
                </div>
                <div class="col-md-3">
                    <select id="item-type-select" class="form-select" onchange="onTypeChange()">
                        <option value="">-- Chọn Loại Hàng Hoá --</option>
                        <option value="part">Phụ tùng</option>
                        <option value="accessory">Phụ kiện</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="dynamic-filter" class="form-select" onchange="searchParts()" disabled>
                        <option value="">-- Vui lòng chọn loại hàng hoá trước --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="searchParts()">Tìm Kiếm</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped bg-white align-middle">
                    <thead class="table-dark">
                        <tr><th>Thương hiệu</th><th>Chủng loại</th><th>Tên hàng hoá</th><th>Mã số</th><th>Nhà cung cấp</th><th>ĐVT</th><th>Tồn kho</th><th>Giá Bán</th></tr>
                    </thead>
                    <tbody id="public-search-results">
                        <tr><td colspan="8" class="text-center text-muted">Nhập thông tin để tìm kiếm phụ tùng...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Đăng Nhập Quản Lý</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label>Tài khoản:</label><input type="text" id="log-user" class="form-control" value="admin"></div>
                    <div class="mb-3"><label>Mật khẩu:</label><input type="password" id="log-pass" class="form-control" value="123456"></div>
                </div>
                <div class="modal-footer"><button class="btn btn-primary w-100" onclick="login()">Đăng Nhập</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const accessoryList = [
            "Bóng đèn", "Dung dịch bảo dưỡng xe", "Nệm ghế nội thất", 
            "Thảm lót sàn", "Thảm taplo", "Hương nội thất", 
            "Trang trí taplo", "Màn hình", "Bọc vô lăng", 
            "Bọc nội thất", "Phụ kiện khác"
        ];
        
        const brandList = [
            "Toyota", "Nissan", "Huyndai", "deawoo", "chevrolet", 
            "Ford", "Mitsubishi", "KIA", "Thaco", "MG", "Honda", 
            "SUZUKI", "BYD", "Zotye", "Basic", "Isuzu", "Vifast", "Khác"
        ];

        let allInventory = [];

        async function init() {
            const resSet = await fetch('/api/settings');
            const settings = await resSet.json();
            if(settings.name) {
                document.getElementById('brand-name').innerText = settings.name;
                document.getElementById('page-title').innerText = settings.name;
            }
            if(settings.address) document.getElementById('nav-address').innerText = settings.address;
            if(settings.phone) document.getElementById('nav-phone').innerText = settings.phone;
            
            try {
                const banners = JSON.parse(settings.banners || '[]');
                if(banners.length > 0) {
                    document.getElementById('carousel-inner').innerHTML = banners.map((url, idx) => `
                        <div class="carousel-item ${idx === 0 ? 'active' : ''}">
                            <img src="${url}" class="banner-img shadow-sm" alt="Banner">
                        </div>
                    `).join('');
                }
            } catch(e) {}
            
            const resInv = await fetch('/api/inventory');
            allInventory = await resInv.json();

            checkUserRole();
            searchParts();
        }

        function onTypeChange() {
            const type = document.getElementById('item-type-select').value;
            const filterSelect = document.getElementById('dynamic-filter');
            filterSelect.disabled = false;
            filterSelect.innerHTML = '<option value="">-- Tất cả --</option>';

            if (type === 'part') {
                brandList.forEach(b => {
                    filterSelect.innerHTML += `<option value="${b}">${b}</option>`;
                });
            } else if (type === 'accessory') {
                accessoryList.forEach(a => {
                    filterSelect.innerHTML += `<option value="${a}">${a}</option>`;
                });
            } else {
                filterSelect.disabled = true;
                filterSelect.innerHTML = '<option value="">-- Vui lòng chọn loại hàng hoá trước --</option>';
            }
            searchParts();
        }

        async function searchParts() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const type = document.getElementById('item-type-select').value;
            const selectedVal = document.getElementById('dynamic-filter').value;

            let filtered = allInventory.filter(i => 
                (i.brand && i.brand.toLowerCase().includes(keyword)) || 
                (i.part_code && i.part_code.toLowerCase().includes(keyword)) || 
                (i.item_name && i.item_name.toLowerCase().includes(keyword)) ||
                (i.category && i.category.toLowerCase().includes(keyword))
            );

            if (type === 'part' && selectedVal) {
                filtered = filtered.filter(i => i.brand === selectedVal);
            } else if (type === 'accessory' && selectedVal) {
                filtered = filtered.filter(i => i.category === selectedVal);
            }

            document.getElementById('public-search-results').innerHTML = filtered.length === 0 ? 
                `<tr><td colspan="8" class="text-center text-muted">Không tìm thấy phụ tùng phù hợp</td></tr>` :
                filtered.map(i => `
                    <tr>
                        <td><b>${i.brand}</b></td>
                        <td>${i.category || ''}</td>
                        <td><b>${i.item_name || ''}</b></td>
                        <td><code>${i.part_code || ''}</code></td>
                        <td>${i.supplier || ''}</td>
                        <td>${i.unit || 'Cái'}</td>
                        <td><span class="badge ${i.quantity > 1 ? 'bg-success' : i.quantity === 1 ? 'bg-warning text-dark' : 'bg-danger'}">${i.quantity}</span></td>
                        <td class="fw-bold text-danger">${Number(i.sell_price).toLocaleString()}đ</td>
                    </tr>
                `).join('');
        }

        function openLoginModal() { new bootstrap.Modal(document.getElementById('loginModal')).show(); }

        async function login() {
            const username = document.getElementById('log-user').value;
            const password = document.getElementById('log-pass').value;
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username, password }) });
            const data = await res.json();
            if(data.success) { localStorage.setItem('user', JSON.stringify(data.user)); window.location.href = 'admin.html'; } else { alert(data.error); }
        }

        function logout() { localStorage.removeItem('user'); location.reload(); }

        function checkUserRole() {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user) {
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
                document.getElementById('admin-nav').style.display = 'inline-block';
            }
        }
        init();
    </script>
</body>
</html>
